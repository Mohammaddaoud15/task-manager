[project]
name = "task-manager"
version = "0.1.0"
description = "A command-line task manager built with Python."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic-settings>=2.14.2",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

#When someone runs it, execute the function main() inside task_manager/cli.py.
[project.scripts]
task-manager = "task_manager.cli:main"
#Without this section, packaging tools wouldn't know how to build the project, making it difficult to install or distribute it as a Python package."
#build backend --> hatchling
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["src/task_manager"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
]
